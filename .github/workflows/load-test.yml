name: Prueba de carga

# Simula muchas personas usando la página a la vez (k6).
#   - En cada PR que toque loadtest/: solo revisa que los scripts estén bien escritos
#     (k6 inspect). NO manda tráfico.
#   - A mano (Actions > Prueba de carga > Run workflow): manda el tráfico de verdad
#     contra el link de un Preview de Vercel. Nunca contra fansreserve.com.
# Solo lectura: no inicia sesión, no crea cuentas, no reserva, no paga.
# Ojo: Preview y Producción comparten la misma base de Supabase.
on:
  pull_request:
    paths:
      - 'loadtest/**'
      - '.github/workflows/load-test.yml'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Link del Preview de Vercel (https://...vercel.app). Nunca fansreserve.com'
        required: true
      prueba:
        description: 'Qué probar'
        type: choice
        options: [visitantes, realtime]
        default: visitantes
      nivel:
        description: 'Visitantes: cuántas personas a la vez'
        type: choice
        options: [humo, '200', '500', '1000', '2000']
        default: humo
      conexiones:
        description: 'Realtime: conexiones en vivo a la vez (plan gratis = 200)'
        default: '150'

permissions:
  contents: read

concurrency:
  group: load-test
  cancel-in-progress: false

jobs:
  revisar-scripts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: '1.3.0'
      - name: Revisar scripts (sin tráfico)
        run: |
          # k6 inspect no lee las variables del sistema: se pasan con -e.
          SB="-e SUPABASE_URL=https://ejemplo.supabase.co -e SUPABASE_ANON_KEY=ejemplo"
          for nivel in humo 200 500 1000 2000; do
            k6 inspect $SB -e BASE_URL=https://ejemplo.vercel.app -e NIVEL=$nivel loadtest/visitantes.js > /dev/null
          done
          k6 inspect $SB loadtest/realtime.js > /dev/null
          # El seguro contra Producción tiene que saltar.
          if k6 inspect $SB -e BASE_URL=https://fansreserve.com loadtest/visitantes.js > /dev/null 2>&1; then
            echo "El script aceptó fansreserve.com y no debería"; exit 1
          fi
          echo "Scripts OK"

  carga:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: '1.3.0'
      - name: Datos públicos de Supabase (los mismos que lleva el navegador)
        run: |
          echo "SUPABASE_URL=$(grep '^VITE_SUPABASE_URL=' .env.production | cut -d= -f2-)" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$(grep '^VITE_SUPABASE_ANON_KEY=' .env.production | cut -d= -f2-)" >> "$GITHUB_ENV"
      - name: Visitantes
        if: inputs.prueba == 'visitantes'
        env:
          BASE_URL: ${{ inputs.base_url }}
          NIVEL: ${{ inputs.nivel }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: ulimit -n 65535 || true; k6 run --no-usage-report loadtest/visitantes.js
      - name: Conexiones en vivo
        if: inputs.prueba == 'realtime'
        env:
          CONEXIONES: ${{ inputs.conexiones }}
        run: ulimit -n 65535 || true; k6 run --no-usage-report loadtest/realtime.js
      - name: Resumen en español
        if: always()
        run: cat loadtest/resultado*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "La prueba no llegó a generar resumen." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultado-carga
          path: loadtest/resultado*
          if-no-files-found: ignore
