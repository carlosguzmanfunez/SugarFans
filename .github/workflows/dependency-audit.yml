name: Dependency audit

# Fails when a library the live site ships has a known high or critical security
# problem. Runs on PRs that change dependencies and every Monday, so a problem
# found after merge also shows up (red run + email to the repo owner).
on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-audit.yml'
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: npm audit (production libraries)
        run: npm audit --omit=dev --audit-level=high
