name: API security

on:
  pull_request:
    paths:
      - 'api/**'
      # Anything an api/ function imports (api-esm-load checks they load like on Vercel).
      - 'src/lib/**'
      - 'src/config/**'
      - 'e2e/live-access.mjs'
      - 'e2e/paypal-api.mjs'
      - 'e2e/public-provider-config.mjs'
      - 'e2e/api-esm-load.mjs'
      - 'src/components/AdminProjection.tsx'
      - 'e2e/admin-projection-ui.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/api-security.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-config-and-payments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAYPAL_ENV: sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:public-config
      - run: npm run test:access
      - run: npm run e2e:paypal
      - run: npm run test:moderation
      - run: npm run test:bunny-video && npm run test:bunny-usage && npm run test:api-esm
      - run: npm run test:assistant-api
      - run: npm run test:admin-projection
      - run: npm run build
