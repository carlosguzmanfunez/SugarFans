name: Reserve attendance city

on:
  pull_request:
    paths:
      - 'src/**'
      - 'api/paypal.ts'
      - 'api/*reserve-session*.ts'
      - 'api/live-token.ts'
      - 'api/push.ts'
      - 'public/sw.js'
      - 'supabase/migrations/**'
      - 'e2e/reserve-city-*.mjs'
      - 'e2e/reserve-catalog-ui.mjs'
      - 'e2e/reserve-controls-*.mjs'
      - 'e2e/reserve-creator-zone-ui.mjs'
      - 'e2e/reserve-wizard-ui.mjs'
      - 'e2e/reserve-short-notice*.mjs'
      - 'e2e/account-navigation-ui.mjs'
      - 'e2e/navigation-security.mjs'
      - 'e2e/reserve-session-*.mjs'
      - 'e2e/admin-reserve-attendance*.mjs'
      - 'e2e/helpers/admin-reserve-attendance-fixture.ts'
      - 'e2e/helpers/admin-workspace-fixture.ts'
      - 'e2e/push-api.mjs'
      - 'e2e/db-harness.mjs'
      - 'e2e/notification-dismiss.mjs'
      - 'e2e/push-device-state.mjs'
      - 'e2e/subscription-notifications.mjs'
      - 'package*.json'
      - '.github/workflows/reserve-city.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reserve-city-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attendance:
    runs-on: ubuntu-24.04 # Playwright 1.56.1 does not support the ubuntu-26.04 runner.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local_ci_only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:navigation-security
      - run: npm run test:notification-dismiss
      - run: npm run test:push-device-state
      - run: npm run test:subscription-notifications
      - run: npm run test:reserve-session-api
      - run: npm run test:reserve-session-db
      - run: npm run test:admin-reserve-attendance
      - run: npm run test:admin-reserve-attendance-db
      - run: npm run test:reserve-response-reminders-db
      - run: node e2e/admin-workspace-data.mjs
      - run: npm run test:push
      - run: npm run test:reserve-city-db
      - run: npm run test:reserve-cancellation-db
      - run: npm run test:reserve-time-zones-db
      - run: node e2e/reserve-controls-postgres.mjs
      - run: node e2e/reserve-short-notice-postgres.mjs
      - run: node e2e/reserve-short-notice.mjs
      - run: node e2e/reserve-controls-api.mjs
      - run: npm run test:proposal-hours-db
      - run: npm run test:time-zones
      # ubuntu-24.04 already provides Chromium's runtime libraries. Avoid fetching
      # unrelated font packs from apt mirrors; keep every browser check below.
      - name: Install Chromium
        run: npx playwright install chromium
        timeout-minutes: 4
      - name: Prepare verified LiveKit test server
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fansreserve-livekit"
          curl --fail --location --retry 2 --max-time 120 https://github.com/livekit/livekit/releases/download/v1.13.11/livekit_1.13.11_linux_amd64.tar.gz -o "$RUNNER_TEMP/fansreserve-livekit/server.tar.gz"
          echo "1e9ee90ca301e1842b2887fc77cb122759756a9c8aeb4334ee91de3325ec43fb  $RUNNER_TEMP/fansreserve-livekit/server.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/fansreserve-livekit/server.tar.gz" -C "$RUNNER_TEMP/fansreserve-livekit"
          echo "LIVEKIT_SERVER=$RUNNER_TEMP/fansreserve-livekit/livekit-server" >> "$GITHUB_ENV"
          echo "SESSION_EVIDENCE_DIR=$RUNNER_TEMP/fansreserve-session-evidence" >> "$GITHUB_ENV"
      - run: npm run test:reserve-session-native
      - run: npm run test:admin-reserve-attendance-ui
      - run: npm run test:reserve-city-ui
      - run: node e2e/reserve-catalog-ui.mjs
      - run: node e2e/account-navigation-ui.mjs
      - run: node e2e/reserve-short-notice-ui.mjs
      - run: node e2e/reserve-controls-ui.mjs
      - run: node e2e/reserve-creator-zone-ui.mjs
      - run: node e2e/reserve-wizard-ui.mjs
