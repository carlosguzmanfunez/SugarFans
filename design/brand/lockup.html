<!doctype html>
<!-- Logo lockups (mark + wordmark), rendered to design/brand/exports/ by scripts/brand-assets.mjs.
     ?primary (default) | ?mono-dark | ?mono-light. Wordmark metrics match src/components/BrandLogo.tsx. -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:Sora;src:url(../../node_modules/@fontsource-variable/sora/files/sora-latin-wght-normal.woff2);font-weight:100 800}
*{margin:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:transparent}
body{display:flex;align-items:center;justify-content:center}
.logo{display:flex;align-items:center;gap:.42em;font-size:120px}
.logo img{width:1.5em;height:1.5em}
.word{font-family:Sora;font-size:.62em;line-height:1;text-transform:uppercase;white-space:nowrap}
.word b{font-weight:700;letter-spacing:.11em}
.word span{font-weight:350;letter-spacing:.16em;margin-right:-.16em}
.primary .word b{color:#160d1f}.primary .word span{color:rgba(22,13,31,.78)}
.mono-dark .word{color:#160d1f}
.mono-light .word{color:#fff}
</style></head><body>
<div class="logo"><img id="m" alt=""><div class="word"><b>Fans</b> <span>Reserve</span></div></div>
<script>
const v = location.search.slice(1) || 'primary';
document.body.className = v;
document.getElementById('m').src = v === 'primary' ? 'mark.svg' : `mark-${v}.svg`;
</script></body></html>
